name: Deploy Wanderly to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Wanderly
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.WANDERLY_SSH_HOST }}
          username: ${{ secrets.WANDERLY_SSH_USERNAME }}
          key: ${{ secrets.WANDERLY_SSH_KEY }}
          script: |
            cd /opt/Wanderly
            git pull origin main
            docker compose up -d --build
